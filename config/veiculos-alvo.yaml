# Veículos que quero encontrar.
# O porquê de cada alvo e o que olhar antes de dar lance: `veiculos-alvo-notas.md` (nada lê esse .md).
# Desative um alvo com `ativo: false` em vez de apagar o bloco.
# ano_min e ano_max referem-se ao ANO DE MODELO (o segundo número em 2018/2019).
# preco_maximo é comparado contra o LANCE CORRENTE do lote.
# quilometragem_maxima é opcional: sem ela, qualquer quilometragem serve.
# Escreva a marca por extenso (Mitsubishi, Chevrolet): o sistema traduz as abreviações do site.
# tipos_leilao aceita: judicial, extrajudicial, financiamento, seguradora, recuperado.
# A busca do Vip traz só recuperados de financiamento: mantenha "financiamento" na lista.
#
# Os tetos abaixo usam a FIPE da melhor versão AUTOMÁTICA do ano mais novo.
#
# Critérios da triagem (feature 006, skill analisar-lotes). O bloco `padrao` vale para todos os alvos;
# cada alvo pode repetir um campo para sobrescrever. `cambio` aceita automatico, cvt e manual (sem acento):
# o bot já descarta quando o leiloeiro informa o câmbio (hoje, o Milan) e a skill confere o resto.
# O texto `triagem` de cada alvo é lido só pela skill: escreva em português o que mais exigir.
padrao:
  cambio: [automatico, cvt]          # preferência do Rafael desde 2026-10-06: só automático
  aceitar_sinistro: false
  aceitar_sucata: false
  aceitar_mecanica_com_problema: false
  aceitar_pequenas_avarias: true     # "PEQUENOS AMASSADOS" ficam na lista

veiculos:
  - marca: Nissan
    modelo: Versa
    ano_min: 2016
    ano_max: 2019
    preco_maximo: 43700   # 70% da FIPE out/2026 do VERSA SL 1.6 Aut. 2019 (R$ 62.464, cód. 023140-1)
   #quilometragem_maxima: 120000 # sem km maxima 
    tipos_leilao:
      - financiamento
    ativo: true

  - marca: Nissan
    modelo: Sentra
    ano_min: 2014
    ano_max: 2017
    preco_maximo: 50100   # 70% da FIPE out/2026 do Sentra SL 2.0 Aut. 2017 (R$ 71.685, cód. 023136-3)
   #quilometragem_maxima: 140000
    tipos_leilao:
      - financiamento
    ativo: true

  - marca: Renault
    modelo: Duster
    # 2018+: primeiro ano do 1.6 SCe CVT (em 2017 os Duster automáticos eram 2.0, sem CVT).
    # A picape "DUSTER OROCH" fica de fora pelo excluir abaixo.
    excluir: [Oroch]
    triagem: "Só 1.6 SCe CVT. Fora 2.0, 1.3 turbo e manual."
    ano_min: 2018
    ano_max: 2022
    preco_maximo: 59500   # 70% da FIPE out/2026 do DUSTER Intense 1.6 Aut. 2022 (R$ 85.014, cód. 025301-4)
    tipos_leilao:
      - financiamento
    ativo: true

  - marca: Renault
    modelo: Fluence
    # O bot casa qualquer Fluence; a skill aplica o texto abaixo. FIPE só tem 2011+.
    triagem: "Só 2.0 Dynamique Plus ou 2.0 Privilège, automáticos. Fora Dynamique manual, Expression 1.6 e GT Line."
    ano_min: 2010
    ano_max: 2017
    preco_maximo: 46900   # 70% da FIPE out/2026 do FLUENCE Privilège 2.0 Aut. 2017 (R$ 67.025, cód. 025175-5)
    tipos_leilao:
      - financiamento
    ativo: true

  # Alvos de conforto (2026-10-09), pela hérnia de disco: banco alto e suspensão macia.
  - marca: Nissan
    modelo: Kicks
    triagem: "Só 1.6 CVT. Preferência (não reprova): versão S, roda 16, mais macia que o SL (roda 17)."
    ano_min: 2018
    ano_max: 2019
    preco_maximo: 56900   # 70% da FIPE out/2026 do KICKS SL 1.6 CVT 2019 (R$ 81.336, cód. 023149-5)
    tipos_leilao:
      - financiamento
    ativo: true

  - marca: Hyundai
    modelo: Creta
    # Teto pela Attitude: pela Prestige 2.0 daria R$ 61.600, frouxo demais.
    triagem: "Preferência (não reprova): Attitude ou Pulse 1.6, roda 16; a Prestige 2.0 (roda 17) serve, mas é mais firme."
    ano_min: 2017
    ano_max: 2018
    preco_maximo: 55000   # 70% da FIPE out/2026 da CRETA Attitude 1.6 Aut. 2018 (R$ 78.651, cód. 015157-2)
    tipos_leilao:
      - financiamento
    ativo: true
